{% extends "base/default-page.html" %}

{% block body %}

<div>
    <div class="text-2xl">
        แก้ไขบทความ
    </div>
        <div class="mb-4">
            <label for="title" class="block text-gray-700 text-sm font-bold mb-2">Title</label>
            <input value="{{ blog.title }}" type="text" id="title" name="title" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div class="mb-4">
            <label for="content" class="block text-gray-700 text-sm font-bold mb-2">Content</label>
            <textarea id="content" name="content" rows="5" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">{{ blog.content }}</textarea>
        </div>
        <button type="submit" data-pk="{{ pk }}" onclick="editBlog(event)" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Edit</button>
</div>

<script>
    function editBlog(event) {
        event.preventDefault();
        const pk = {{ pk }};
        const title = document.getElementById("title").value;
        const content = document.getElementById("content").value;

        fetch(`/api/v1/blogs/${pk}/`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}",
            },
            body: JSON.stringify({ title, content }),
        })
            .then(response => response.json())
            .then(() => {
                window.location.href = "/";
            });
        };
</script>

{% endblock %}
