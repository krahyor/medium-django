{% extends "base/default-page.html" %}

{% block body %}

<div>
    <dic class="text-2xl">
        สร้างบทความใหม่
    </dic>
        <div class="mb-4">
            <label for="title" class="block text-gray-700 text-sm font-bold mb-2">Title</label>
            <input type="text" id="title" name="title" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none
    focus:shadow-outline">
        </div>
        <div class="mb-4">
            <label for="content" class="block text-gray-700 text-sm font-bold mb-2">Content</label>
            <textarea id="content" name="content" rows="5" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"></textarea>
        </div>
        <button type="submit" onclick="createBlog(event)" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Create</button>
</div>

<script>
    function createBlog(event) {
        event.preventDefault();
        const title = document.getElementById("title").value;
        const content = document.getElementById("content").value;
        fetch("/api/v1/blogs/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}",
            },
            body: JSON.stringify({ title, content }),
        })
        .then(response => response.json())
        .then(data => {
            alert("Blog created successfully!");
            window.location.href = "/";
        })
        .catch(error => {
            console.error("Error creating blog:", error);
            alert("Failed to create blog.");
        });
    }
</script>

{% endblock %}
